<div class="signup-container">
  <div class="signup-card">
    <div class="logo-container">
      <h1 class="logo-text">TicTacToe</h1>
      <div class="logo-icon">
        <span class="x-icon">X</span><span class="o-icon">O</span>
      </div>
    </div>

    <h2 class="signup-title">Login</h2>

    <form class="signup-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-container">
          <i class="input-icon user-icon">👤</i>
          <input
            type="text"
            [(ngModel)]="username"
            id="username"
            name="username"
            placeholder="Enter your username..."
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-container">
          <i class="input-icon password-icon">🔒</i>
          <input
            type="password"
            [(ngModel)]="password"
            id="password"
            name="password"
            placeholder="Enter your password..."
            required
          />
        </div>
      </div>

      <button type="submit" class="signup-button">Sign Up</button>

      @if (numberOfAccounts === 0) {
      <h3 class="error-message">
        {{ errorMessage }}
      </h3>
      }
    </form>

    <div class="login-prompt">
      You do not have an account?
      <a href="/signup" class="login-link">Sign Up</a>
    </div>
  </div>
</div>
